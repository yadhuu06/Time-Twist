{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: black; /* Orange */
            --secondary-color: #3f37c9;
        }
        
        body {
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f4f9 100%);
            min-height: 100vh;
        }

        .main-container {
            padding: 2rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            max-width: 1200px;
        }

        .image-section {
            background-color: var(--primary-color);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            position: relative;
        }

        .image-section img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
        }

        .form-section {
            padding: 3rem 2rem;
            flex: 1;
        }

        .form-section h2 {
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .form-floating {
            margin-bottom: 1.2rem;
        }

        .form-floating > label {
            color: #6b7280;
        }

        .form-floating > .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.15);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-1px);
        }

        .login-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');

        .logo {
            margin-left: 50px;
            margin-top: 40px;
            font-size: 2rem;
            font-weight: 780;
            font-family: 'Montserrat', sans-serif;
            color: white;
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 992px) {
            .auth-card {
                margin: 1rem;
                flex-direction: column;
            }
            
            .image-section {
                padding: 2rem 1rem;
            }

            .form-section {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="auth-card">
            <div class="image-section">
                <div class="logo">
                    <span style="color: #ffa500;">TIME</span>
                    <span style="color: white;">TWIST</span>
                </div>
                <img src="{% static 'UserSide/img/reg.jpg' %}" alt="Registration Image" class="img-fluid">
            </div>
            <div class="form-section">
                <h2 class="text-center">Create Account</h2>
                <form action="{% url 'Register' %}" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="id_firstname" name="firstname" required minlength="3" placeholder="First Name">
                                <label for="id_firstname">First Name</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="id_lastname" name="lastname" required minlength="2" placeholder="Last Name">
                                <label for="id_lastname">Last Name</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-floating">
                        <input type="email" class="form-control" id="id_email" name="email" required placeholder="Email">
                        <label for="id_email">Email Address</label>
                    </div>

                    <div class="form-floating">
                        <input type="tel" class="form-control" id="id_phone" name="phone" required pattern="\d{10}" title="Phone number must be 10 digits" minlength="10" maxlength="10" placeholder="Phone">
                        <label for="id_phone">Phone Number</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="id_password" name="password1" required minlength="6" placeholder="Password">
                        <label for="id_password">Password</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="id_confirm_password" name="password2" required minlength="6" placeholder="Confirm Password">
                        <label for="id_confirm_password">Confirm Password</label>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                    </div>

                    <p class="text-center mt-4">
                        Already have an account? <a href="{% url 'login_view' %}" class="login-link">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% if messages %}
                const messages = [
                    {% for message in messages %}
                        { level: "{{ message.tags|default_if_none:'info' }}", text: "{{ message|escapejs }}" },
                    {% endfor %}
                ];
                messages.forEach(function(message) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: message.level,
                        title: message.text,
                        showConfirmButton: false,
                        timer: 3000
                    });
                });
            {% endif %}
        });
    </script>
</body>
</html>
