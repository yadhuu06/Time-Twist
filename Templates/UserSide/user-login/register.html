{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
    :root {
        --primary-color: #000000;
        --secondary-color: #ffa500;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
    
    body {
        background-color: #f5f5f5;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .main-container {
        width: 100%;
        max-width: 1200px;
        padding: 0;
        margin: 0 2rem;
    }
    
    .auth-card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        width: 100%;
        height: 550px;
    }
    
    .image-section {
        background-color: var(--primary-color);
        width: 50%;
        padding: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 24px 0 0 24px;
    }
    
    .logo {
        position: absolute;
        top: 2rem;
        left: 2rem;
        font-family: 'Montserrat', sans-serif;
        font-size: 2rem;
        font-weight: 700;
    }
    
    .logo span:first-child {
        color: var(--secondary-color);
    }
    
    .logo span:last-child {
        color: white;
    }
    
    .image-section img {
        width: 70%;
        height: auto;
        object-fit: contain;
    }
    
    .form-section {
        width: 50%;
        padding: 2rem 3rem;
        display: flex;
        flex-direction: column;
    }
    
    .form-section h2 {
        color: var(--primary-color);
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: left;
    }
    
    .form-floating {
        margin-bottom: 1rem;
    }
    
    .form-floating > .form-control {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0.75rem;
        height: calc(3rem + 2px);
        font-size: 1rem;
    }
    
    .form-floating > .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }
    
    .form-floating > label {
        padding: 0.75rem;
        color: #64748b;
    }
    
    .row {
        display: flex;
        gap: 1rem;
        margin-bottom: 0;
    }
    
    .col-md-6 {
        flex: 1;
        padding: 0;
    }
    
    .btn-primary {
        background-color: var(--primary-color);
        border: none;
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        margin-top: 0.5rem;
    }
    
    .btn-primary:hover {
        background-color: #1a1a1a;
    }
    
    .text-center {
        text-align: center;
        margin-top: 1rem;
        color: #64748b;
    }
    
    .login-link {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
    }
    
    .login-link:hover {
        color: var(--secondary-color);
    }
    
    @media (max-width: 992px) {
        .main-container {
            margin: 1rem;
        }
        
        .auth-card {
            flex-direction: column;
            height: auto;
        }
        
        .image-section,
        .form-section {
            width: 100%;
            padding: 2rem;
        }
        
        .image-section {
            padding-top: 4rem;
            border-radius: 24px 24px 0 0;
        }
        
        .row {
            flex-direction: column;
            gap: 0;
        }
        
        .form-section h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
    }
   </style>
</head>
<body>
    <div class="main-container">
        <div class="auth-card">
            <div class="image-section">
                <div class="logo">
                    <span style="color: #ffa500;">TIME</span>
                    <span style="color: white;">TWIST</span>
                </div>
                <img src="{% static 'UserSide/img/reg.jpg' %}" alt="Registration Image" class="img-fluid">
            </div>
            <div class="form-section">
                <h2 class="text-center">Create Account</h2>
                <form action="{% url 'Register' %}" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="id_firstname" name="firstname" required minlength="3" placeholder="First Name">
                                <label for="id_firstname">First Name</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="id_lastname" name="lastname" required minlength="2" placeholder="Last Name">
                                <label for="id_lastname">Last Name</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-floating">
                        <input type="email" class="form-control" id="id_email" name="email" required placeholder="Email">
                        <label for="id_email">Email Address</label>
                    </div>

                    <div class="form-floating">
                        <input type="tel" class="form-control" id="id_phone" name="phone" required pattern="\d{10}" title="Phone number must be 10 digits" minlength="10" maxlength="10" placeholder="Phone">
                        <label for="id_phone">Phone Number</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="id_password" name="password1" required minlength="6" placeholder="Password">
                        <label for="id_password">Password</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="id_confirm_password" name="password2" required minlength="6" placeholder="Confirm Password">
                        <label for="id_confirm_password">Confirm Password</label>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                    </div>

                    <p class="text-center mt-4">
                        Already have an account? <a href="{% url 'login_view' %}" class="login-link">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% if messages %}
                const messages = [
                    {% for message in messages %}
                        { level: "{{ message.tags|default_if_none:'info' }}", text: "{{ message|escapejs }}" },
                    {% endfor %}
                ];
                messages.forEach(function(message) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: message.level,
                        title: message.text,
                        showConfirmButton: false,
                        timer: 3000
                    });
                });
            {% endif %}
        });
    </script>
</body>
</html>
